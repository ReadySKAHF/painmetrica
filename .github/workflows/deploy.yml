name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hoster.by VPS
    runs-on: ubuntu-latest

    steps:
      - name: Debug SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "=== First line ==="
          head -1 ~/.ssh/deploy_key
          echo "=== Last line ==="
          tail -1 ~/.ssh/deploy_key
          echo "=== Line count ==="
          wc -l ~/.ssh/deploy_key
          echo "=== ssh-keygen check ==="
          ssh-keygen -l -f ~/.ssh/deploy_key || echo "INVALID KEY"
