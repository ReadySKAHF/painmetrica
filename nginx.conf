upstream django {
    server web:8000;
}

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name painmetrica.by www.painmetrica.by;

    # SSL-сертификаты Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/painmetrica.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painmetrica.by/privkey.pem;

    # Современные протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (совпадает с Django SECURE_HSTS_SECONDS = 31536000)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Максимальный размер загружаемого файла
    client_max_body_size 20M;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Статика Django (collectstatic → /app/staticfiles)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Медиафайлы (локальное хранилище — когда SUPABASE_S3_ENDPOINT не задан)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Проксирование всех остальных запросов к Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
