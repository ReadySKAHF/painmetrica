{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="{% static 'favicon-nobg.svg' %}" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слишком много запросов — Painmetrica</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: #F5F5F5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.error-card {
  background: #FEFEFE;
  border-radius: 16px;
  padding: 48px 40px;
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.07);
}
.error-code { font-size: 72px; font-weight: 700; color: #2E67F6; line-height: 1; }
.error-title { font-size: 22px; font-weight: 600; color: #262626; margin: 16px 0 12px; }
.error-text  { font-size: 14px; color: #919191; line-height: 1.6; }
.btn-back {
  display: inline-block;
  margin-top: 28px;
  padding: 12px 28px;
  background: #2E67F6;
  color: #FEFEFE;
  border-radius: 33px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: opacity 0.15s;
}
.btn-back:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="error-card">
  <div class="error-code">429</div>
  <h1 class="error-title">Слишком много запросов</h1>
  <p class="error-text">
    Вы отправили слишком много запросов за короткое время.<br>
    Подождите несколько минут и попробуйте снова.
  </p>
  <a href="/" class="btn-back">На главную</a>
</div>
</body>
</html>
