{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/static/favicon-nobg.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painmetrica</title>
<style>
@font-face {
    font-family: 'Proxima Nova';
    src: url('/static/fonts/ProximaNova-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-500: #2E67F6;
    --gray-950: #262626;
    --gray-550: #919191;
    --gray-250: #F5F5F5;
    --white:    #FEFEFE;
    --font: 'Proxima Nova', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--white);
    color: var(--gray-950);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ─────────────────────────────────────────────────────── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 52px;
    max-width: 1320px;
    width: 100%;
    margin: 0 auto;
  }

  .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .btn-login {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 9px 22px;
    background: var(--blue-500);
    border: none;
    border-radius: 48px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn-login:hover { opacity: .9; }

  /* ── MAIN ────────────────────────────────────────────────────────── */
  main { flex: 1; }

  /* ── FOOTER ──────────────────────────────────────────────────────── */
  .footer {
    width: 1320px;
    max-width: calc(100vw - 24px);
    margin: 40px auto 0;
    background: var(--white);
    border-radius: 28px 28px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0;
    gap: 8px;
  }
  .footer-logo { display: flex; align-items: center; }
  .footer-tagline { font-size: 14px; color: var(--gray-950); text-align: center; line-height: 1.5; padding: 0 24px; }
  .footer-copy { font-size: 14px; color: var(--gray-950); text-align: center; }

  @media (max-width: 600px) {
    header { padding: 20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="{% url 'core:home' %}" class="logo" title="Painmetrica">
    <img src="/static/logo-header-nobg.svg" alt="Painmetrica" width="172" height="43" style="display:block;">
  </a>
  <a href="{% url 'accounts:login' %}" class="btn-login">Войти в личный кабинет</a>
</header>

<!-- MAIN -->
<main></main>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-logo">
    <img src="/static/logo-header-nobg.svg" alt="Painmetrica" width="114" height="28" style="display:block;">
  </div>
  <span class="footer-tagline">Система управления пациентами для врачей и специалистов</span>
  <span class="footer-copy">© Painmetrica 2026. Все права защищены</span>
</footer>

</body>
</html>
